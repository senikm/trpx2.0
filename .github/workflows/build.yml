name: Build

on:
  push:
  pull_request:

jobs:
  # Builds tests/build_test.cpp and tests/format_test.cpp with the compilers of
  # the runner images and runs them.
  posix:
    name: ${{ matrix.os }} ${{ matrix.cxx }} ${{ matrix.flags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, cxx: g++-11 }
          - { os: ubuntu-22.04, cxx: g++-12 }
          - { os: ubuntu-22.04, cxx: clang++-13 }
          - { os: ubuntu-22.04, cxx: clang++-14 }
          - { os: ubuntu-22.04, cxx: clang++-15 }
          - { os: ubuntu-24.04, cxx: g++-13 }
          - { os: ubuntu-24.04, cxx: g++-14 }
          - { os: ubuntu-24.04, cxx: clang++-16 }
          - { os: ubuntu-24.04, cxx: clang++-17 }
          - { os: ubuntu-24.04, cxx: clang++-18 }
          - { os: ubuntu-24.04, cxx: clang++-18, flags: -stdlib=libc++, packages: libc++-18-dev libc++abi-18-dev }
          - { os: macos-26, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install packages
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Build
        run: |
          ${{ matrix.cxx }} --version
          ${{ matrix.cxx }} -std=c++20 -Wall -Wextra -Werror -pthread ${{ matrix.flags }} -I include tests/build_test.cpp -o build_test
          ${{ matrix.cxx }} -std=c++20 -Wall -Wextra -Werror -pthread ${{ matrix.flags }} -I include tests/format_test.cpp -o format_test
      - name: Test
        run: ./build_test
      - name: Test file format
        run: ./format_test

  windows:
    name: ${{ matrix.os }} MSVC
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Sets up MSVC with vcvars64.bat of the Visual Studio found by vswhere.
      - name: Build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /std:c++20 /permissive- /EHsc /W4 /WX /I include tests\build_test.cpp || exit /b 1
          cl /std:c++20 /permissive- /EHsc /W4 /WX /I include tests\format_test.cpp
      - name: Test
        run: .\build_test.exe
      - name: Test file format
        run: .\format_test.exe

  # Builds the benchmarks with CMake, without running them: the timings of
  # shared runners are not meaningful.
  benchmarks:
    name: Build benchmarks on Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Google Benchmark
        run: sudo apt-get update && sudo apt-get install -y libbenchmark-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_PYTERSE=OFF -DBUILD_TERSECODEC=OFF -DBUILD_BENCHMARKS=ON
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
      # Naming both targets makes the build fail if CMake did not find Google
      # Benchmark, instead of silently skipping terse_gbenchmark.
      - name: Build
        run: cmake --build build --target terse_benchmark terse_gbenchmark
